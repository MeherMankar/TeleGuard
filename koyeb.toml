[app]
name = "teleguard"

[services.teleguard-bot]
type = "web"
instance_type = "nano"
regions = ["fra"]

[services.teleguard-bot.build]
type = "docker"
dockerfile = "Dockerfile"

[services.teleguard-bot.ports]
[[services.teleguard-bot.ports]]
port = 8080
protocol = "http"
public = true

[services.teleguard-bot.health_check]
http = { path = "/health", port = 8080 }
grace_period_seconds = 90
interval_seconds = 30
restart_limit = 3

[services.teleguard-bot.env]
PORT = "8080"
ENVIRONMENT = "production"
KOYEB_DEPLOYMENT = "true"
