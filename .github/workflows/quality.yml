name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 isort mypy pytest
        pip install -r requirements.txt
    
    - name: Format check
      run: black --check .
    
    - name: Lint check
      run: flake8 .
    
    - name: Import sort check
      run: isort --check-only .
    
    - name: Type check
      run: mypy teleguard --ignore-missing-imports
    
    - name: Run tests
      run: pytest tests/ -v --cov=teleguard