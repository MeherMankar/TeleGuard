name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 isort mypy pytest pytest-cov
        pip install -r requirements.txt
    
    - name: Format check
      run: black --check .
    
    - name: Lint check
      run: flake8 .
    
    - name: Import sort check
      run: isort --check-only .
    
    - name: Type check
      run: mypy teleguard --ignore-missing-imports
    
    - name: Run tests
      run: pytest tests/ -v --cov=teleguard
      env:
        API_ID: "12345"
        API_HASH: "0123456789abcdef0123456789abcdef"
        BOT_TOKEN: "12345:test"
        MONGO_URI: "mongodb://localhost:27017/teleguard"
        JWT_SECRET: "ci-only-test-secret-value-at-least-32-chars"

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: npm ci
      working-directory: frontend

    - name: Lint frontend
      run: npm run lint
      working-directory: frontend

    - name: Build frontend
      run: npm run build
      working-directory: frontend