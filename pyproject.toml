[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["teleguard"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.vercel]
[tool.vercel]
entrypoint = "backend.main:app"

[project]
name = "teleguard"
version = "0.1.0"
description = "TeleGuard backend"
requires-python = ">=3.11,<4.0"
dependencies = [
    "telethon==1.41.0",
    "pyrogram>=2.0.106",
    "aiohttp>=3.11.10",
    "cryptography>=43.0.3",
    "pymongo>=4.10.1",
    "motor>=3.6.0",
    "python-dotenv==1.0.1",
    "APScheduler==3.11.0",
    "requests>=2.32.3",
    "redis>=5.2.0",
    "psutil>=6.1.0",
    "bcrypt==4.2.0",
    "pysocks>=1.7.1",
    "aiohttp-socks>=0.8.4",
    "aiodns>=3.1.1",
    "aiofiles>=23.2.0",
    "uvloop>=0.19.0; sys_platform != \"win32\"",
    "setproctitle>=1.3.3",
    "fastapi",
    "uvicorn",
    "python-jose",
]